      conflict: 林夏质问顾言，顾言否认放信，双方信任破裂
      purpose: 揭示关键道具，制造冲突
    evidence: 原文：林夏回到旧楼……信封……照片……顾言说：‘那封信不是我放的。’……‘我也收到了短信。’
  - chapter_id: chapter_002
    source_chapter: 2
    chapter_title: 第二章 重逢
    scene_title: 公司重逢
    location: 公司会议室及走廊
    time: 日
    on_stage_characters:
