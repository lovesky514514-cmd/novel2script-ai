    - 顾言
    off_stage_characters:
    - 项目经理
    - 林建平
    key_events:
    - 顾言作为技术顾问出现在公司会议室，林夏与他重逢
    - 会议结束后，顾言叫住林夏要求看信和照片
    - 林夏质问顾言三年前的隐瞒
    - 顾言展示自己收到的神秘短信：她已经回去了。你再不出现，就来不及了。
    - 顾言透露三年前林夏父亲在查旧仓库被删掉的监控录像，且六月十七日晚两人都在仓库
    - 林夏收到第二条神秘短信：想知道他隐瞒了什么，今晚十二点，旧仓库。带上钥匙。
    key_props:
    - 手机
    - 短信
    conflict: 林夏认为顾言故意隐瞒真相，顾言试图解释但无法获得信任，两人因三年前的事件产生激烈对峙
    purpose: 展现林夏与顾言重逢后的矛盾与不信任，揭露顾言也被神秘短信引回，并引出三年前父亲调查监控录像的线索，推动主线发展
    must_include:
    - 顾言通过短信被引回
    - 顾言透露父亲查监控录像
    - 林夏收到要求带钥匙的短信
    must_not:
