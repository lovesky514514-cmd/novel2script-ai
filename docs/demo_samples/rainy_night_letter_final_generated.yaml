      - 播放录音，父亲声音揭示顾言是受其嘱咐隐瞒。
      - 项目经理从黑暗中出现，手持另一把钥匙，承认自己是幕后黑手。
      props:
      - 钥匙
      - 旧保险箱
      - 录音笔
      - 旧手机
      - 折起来的纸
      - 另一把钥匙
      conflict: 林夏与顾言对峙钥匙来历，项目经理现身打破二人之间的猜疑，新的对抗开始。
      purpose: 揭露部分真相，将冲突从内部猜疑转向外部敌手，加速剧情推进。
    evidence: 原文：'林夏抬起手，把钥匙亮给他看。'、'顾言看着钥匙，脸色终于变了。'、'真正拿走监控的人，不是顾言。是我身边最信任的人。'、'项目经理站在货架旁，手里握着另一把一模一样的钥匙。'
