      props:
      - 钥匙
      - 蓝色塑料牌
      - 旧书
      conflict: 林夏对钥匙的来历和父亲失踪的关联感到疑惑。
      purpose: 引出关键道具钥匙，推动林夏前往仓库。
    - title: 仓库对峙
