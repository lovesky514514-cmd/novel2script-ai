    - 照片
    - 短信
    conflict: 林夏对顾言产生强烈怀疑，顾言试图解释但缺乏信任
    purpose: 设置悬念，引出三年前父亲失踪事件，制造林夏与顾言之间的信任危机，推动剧情发展
    must_include:
