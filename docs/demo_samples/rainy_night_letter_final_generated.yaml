  used_rules:
  - id: scene_002
    category: scene
    title: 单场戏有阻碍
    rule: 场景必须有阻碍目标达成的人、条件、规则或信息差。
  - id: char_009
    category: character
    title: 反派也要有目标
    rule: 阻碍力量应有自己的逻辑和目标。
  - id: scene_001
    category: scene
    title: 单场戏有目标
    rule: 场景开始时至少一个人物带着明确目标进入。
  - id: scene_006
    category: scene
    title: 场景不写无功能闲聊
    rule: 无目标、无阻碍、无变化的对话应删除。
  - id: screen_basic_008
    category: screenwriting_basic
    title: 开端建立处境
    rule: 开端应快速交代人物处境、目标、压力和问题。
  - id: web_002
    category: web_drama
    title: 前三十秒建立目标阻碍
    rule: 短剧前段应让观众知道谁遇到麻烦、想要什么、为什么不能马上解决。
  - id: adapt_002
    category: adaptation
    title: 内心独白外化
    rule: 小说内心独白应转化为动作、道具互动、对白、停顿或场景调度。
  - id: dialogue_001
    category: dialogue
    title: 对白不是解释剧情
    rule: 对白应推动目标、关系、冲突或信息变化。
  - id: dialogue_002
    category: dialogue
    title: 对白是语言行动
    rule: 人物说话应服务于试探、威胁、回避、讨好、反击或示弱。
  - id: dialogue_003
    category: dialogue
    title: 潜台词优先
    rule: 人物嘴上说的内容和真实意图可以不一致。
  - id: dialogue_009
    category: dialogue
    title: 对白后关系要变化
    rule: 一段对白结束后，人物关系或信息状态应发生变化。
  - id: dialogue_010
    category: dialogue
    title: 读剧检查顺口度
