    - 林夏在十二点前到达西港十七号仓库，顾言已在门口。
    - 顾言说钥匙不是林夏父亲的，林夏用钥匙打开仓库。
    - 仓库内发现一个贴着'林建平'标签的旧保险箱，内有一部旧手机、一支录音笔和一张折起来的纸。
    - 林夏播放录音笔，父亲声音说出顾言骗她是受自己嘱咐，真正拿走监控的是身边最信任的人。
    - 项目经理从仓库深处现身，手持另一把相同的钥匙，承认录音被他找到。
    key_props:
