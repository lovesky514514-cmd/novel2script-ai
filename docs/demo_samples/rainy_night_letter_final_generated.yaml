      purpose: 引入核心悬念：父亲查监控录像，以及钥匙的线索
    evidence: 原文：顾言展示短信、顾言说“你父亲不是普通失踪。他在出事前，正在查一批被删掉的监控录像。旧仓库的监控。六月十七日晚上，你父亲去过那里。我也去过。”、林夏收到第二条短信。
  - chapter_id: chapter_003
    source_chapter: 3
    chapter_title: 第三章 钥匙
    scene_title: 仓库中的真相
    location:
    - 林夏家
