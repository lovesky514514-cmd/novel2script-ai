accuracy_pipeline:
  story_bible:
    genre: 悬疑/都市
    logline: 三年前父亲失踪并留下谜团，林夏在神秘短信指引下重遇旧爱顾言，两人被迫合作揭开被隐藏的真相，却发现信任早已被幕后黑手精心设计。
    characters:
    - name: 林夏
      role: 女主角
      motivation: 查清父亲失踪的真相与三年前的秘密。
      state: 收到神秘短信后回到旧楼，发现照片和钥匙，与顾言重逢，逐步接近真相。
    - name: 顾言
      role: 男主角
      motivation: 保护林夏，同时面对自己过去的隐瞒和真相。
      state: 同样收到短信出现在旧楼，成为公司技术顾问，与林夏合作调查，内心充满负罪感。
    - name: 林建平
      role: 线索人物/林夏父亲
      motivation: 通过留下的录音和钥匙引导林夏找到真相。
      state: 三年前失踪，留下保险箱、录音笔和钥匙。
    - name: 项目经理
      role: 反派/幕后黑手
      motivation: 掩盖三年前监控录像被删除的真相。
      state: 表面是公司项目经经理，实则是策划一切的人，最后在仓库现身。
    relationships:
    - source: 林夏
      target: 顾言
      relation: 旧日恋人，因三年前事件产生误会和隐瞒，现被迫合作。
    - source: 林夏
      target: 林建平
      relation: 父女，父亲通过录音为女儿留下线索。
    - source: 顾言
      target: 林建平
      relation: 顾言曾受林建平所托隐瞒部分真相。
    - source: 林夏
      target: 项目经理
      relation: 同事，实则是敌对关系，对方是幕后操控者。
    timeline:
    - 三年前的六月十七日，林夏父亲失踪，顾言离开，林夏拉黑顾言。
    - 现在，林夏收到短信，雨夜回到旧楼，发现信封和照片。
    - 第二天，林夏在公司见到顾言成为技术顾问，两人对峙。
    - 林夏收到第二条短信，前往旧仓库。
    - 林夏在家中翻找出钥匙，前往西港十七号仓库。
    - 顾言也在仓库门口，林夏用钥匙打开仓库。
    - 林夏发现保险箱、录音笔、旧手机和纸条。
    - 播放录音，父亲说出顾言是受他嘱咐隐瞒，并指出真正拿走监控的是身边最信任的人。
    - 仓库深处项目经理出现，手持另一把钥匙，承认是幕后黑手。
    foreshadows:
    - prop: 信封
      first_seen: 第一章 旧楼门口
      payoff: 引出照片和短信，推动故事发展。
    - prop: 照片
      first_seen: 第一章 信封内
      payoff: 显示顾言与神秘人的合影，成为关键证据。
    - prop: 钥匙
      first_seen: 第三章 旧书内
      payoff: 打开仓库，找到保险箱和录音。
    - prop: 短信
      first_seen: 第一章 林夏手机
      payoff: 引导林夏和顾言返回旧楼和仓库。
    - prop: 录音笔
      first_seen: 第三章 保险箱内
      payoff: 揭示父亲与顾言的约定和真正黑手。
    global_rules:
    - 保留核心悬念：三年前父亲失踪、监控录像、顾言的隐瞒。
    - 保持悬疑节奏：神秘短信、照片、钥匙、录音逐步揭露。
    - 强化反转：项目经理表面中立，实为幕后黑手。
    - 情感纠葛：林夏与顾言的信任危机贯穿故事。
