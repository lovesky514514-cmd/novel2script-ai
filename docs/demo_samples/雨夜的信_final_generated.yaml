      conflict: 林夏对顾言产生怀疑，顾言试图解释但缺乏证据。
      purpose: 展示关键线索，冲突初现
    evidence: "林夏回到旧楼时，雨已经下了整整一夜。\r\n\r\n这栋楼快拆了，楼道里的感应灯坏了很久，墙皮被潮气泡得发软，风一吹，门缝里就传出细小的呜咽声。她原本不该回来。三年前离开这里以后，她把钥匙扔进了江里，把顾言的号码拉黑，也把那场没有解释的告别当成一场失败的梦。\r\
      \n\r\n可今天下午，她收到一条陌生短信。\r\n\r\n“如果你还想知道三年前的真相，今晚十点，回旧楼。”\r\n\r\n短信没有署名。\r\n\r\
      \n林夏站在楼下，雨水顺着伞骨往下滴。她抬头看向三楼，那里曾经是她和顾言一起租过的小屋。窗户黑着，像一只闭上的眼睛。\r\n\r\n她上楼时，楼道里只有自己的脚步声。\r\
      \n\r\n三楼门口，地上放着一个牛皮纸信封。信封被塑料袋包着，没有淋湿，上面只写了一行字：\r\n\r\n别再相信顾言。\r\n\r\n林夏的手僵住。\r\
      \n\r\n她蹲下去，把信封拿起来。里面只有一张照片。\r\n\r\n照片里，顾言站在仓库门口，身旁是一个穿黑色雨衣的人。那个人低着头，看不清脸。照片背面写着日期——三年前的六月十七日。\r\
      \n\r\n正是她父亲出事的那一天。\r\n\r\n林夏呼吸一滞，指尖发冷。\r\n\r\n三年前，她父亲突然失踪，留下欠债、空房和一堆无人解释的疑点。顾言说他什么都不知道，可第二天"
