  story_bible:
    genre: 悬疑/情感
    logline: 三年前父亲失踪，一封雨夜的信将林夏引回旧楼，与隐瞒真相的前男友顾言重逢，两人被神秘短信牵引至旧仓库，发现父亲留下的录音，揭开一场围绕监控录像的骗局。
    characters:
    - name: 林夏
      role: 女主角
      motivation: 查清父亲失踪与三年前事件的真相
      state: 参与当前改编主线，发现父亲录音和项目经理是幕后操纵者
    - name: 顾言
      role: 男主角
      motivation: 保护林夏，同时面对自己曾经的隐瞒
      state: 参与当前改编主线，与林夏对峙后透露部分真相
    - name: 林建平
      role: 林夏父亲，线索人物
      motivation: 通过录音和物证保护林夏
      state: 已失踪，通过录音揭示顾言是受其委托隐瞒
    - name: 项目经理
      role: 关键反转人物，幕后黑手
      motivation: 掩盖三年前的关键证据
      state: 在仓库现身，手握钥匙，已暴露
    relationships:
    - source: 林夏
      target: 顾言
      relation: 旧恋人，因父亲失踪和顾言隐瞒而分手，重逢后彼此怀疑
    - source: 林夏
      target: 林建平
      relation: 父女关系，林建平通过录音揭示真相
    - source: 顾言
      target: 林建平
      relation: 林建平委托顾言隐瞒真相，保护林夏
    - source: 项目经理
      target: 林建平
      relation: 曾经信任的人，实际上偷走监控录像，是幕后黑手
    timeline:
    - 第一章：雨夜，林夏收到匿名短信回到旧楼，发现放在门口的信封内含一张照片（顾言与黑衣人在仓库门口，日期为父亲出事日）。顾言出现，声称也收到短信。
    - 第二章：次日林夏在公司见到新来的技术顾问顾言。顾言告知父亲失踪前在查旧仓库监控录像，并展示自己收到的短信。林夏收到新短信要求午夜带钥匙去旧仓库。
    - 第三章：林夏在家中旧书中找到父亲留下的钥匙（西港17号）。午夜赶往西港仓库，顾言已到。用钥匙打开仓库，找到保险箱，内有旧手机、录音笔和纸条。录音中父亲说顾言是受他委托隐瞒，并暗示身边有内鬼。项目经理现身，手握另一把钥匙，承认是幕后操纵者。
    foreshadows:
    - prop: 信封及照片
      first_seen: 第一章，林夏在旧楼门口发现牛皮纸信封，内含顾言与黑衣人的照片
      payoff: 照片日期指向父亲出事日，成为调查关键线索
    - prop: 钥匙（西港17号）
      first_seen: 第一章提及林夏三年前扔掉钥匙，第三章在家中旧书中找到
      payoff: 打开西港仓库，找到父亲留下的保险箱
    - prop: 匿名短信
      first_seen: 第一章林夏收到第一条短信，第二章顾言展示收到类似短信
      payoff: 逐步引导林夏和顾言回到旧楼、仓库，推动剧情
    - prop: 录音笔
      first_seen: 第三章保险箱中发现
      payoff: 揭示父亲失踪真相和顾言隐瞒的原因
    - prop: 旧手机
      first_seen: 第三章保险箱中发现
      payoff: 可能存储更多证据，待后续使用
    - prop: 仓库监控录像
      first_seen: 第二章顾言提到父亲在查旧仓库监控
      payoff: 核心证据，被项目经理偷走，是悬念中心
    global_rules:
    - 保留信、照片、钥匙、录音等关键道具的伏笔和揭示节奏
    - 保持人物之间隐瞒与误会的关系张力，避免过早释疑
    - 三年前真相需在后续章节逐步揭开，每章至少释放一个新线索
