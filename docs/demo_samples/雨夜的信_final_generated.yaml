    scene_units:
    - title: 旧楼门口及楼道
      location: 旧楼楼下至三楼门口
      time: 夜
      characters:
      - 林夏
      - 顾言
      events:
      - 林夏回旧楼，发现信封和照片，顾言出现
      props:
